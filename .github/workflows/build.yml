name: Build crDroid 16 (Android 16) for X6739

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label. Free public repos: ubuntu-latest (4 vCPU/16 GB). Paid larger runner: ubuntu-latest-8-cores / -16-cores.'
        required: false
        default: 'ubuntu-latest'
      jobs:
        description: 'Parallel compile jobs (-j). 4 fits the free runner, 8-16 for larger runners.'
        required: false
        default: '4'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    # GitHub-hosted jobs are hard-capped at 360 minutes; anything longer is killed.
    timeout-minutes: 350
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Reclaim maximum disk
        run: |
          df -h /
          # free-disk-space leaves a lot behind on current images; AOSP 16 needs
          # every byte on an 84 GB runner volume.
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet \
                      /opt/ghc /usr/local/aws-cli /usr/share/swift /opt/microsoft \
                      /usr/local/share/chromium /opt/google/chrome 2>/dev/null || true
          sudo apt-get clean -y 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          df -h /

      - name: Show resources
        run: |
          nproc; free -h; df -h /

      - name: Add swap (16 GB runner needs headroom for soong)
        run: |
          # The runner image ships a busy /swapfile, so extend with /swap2 instead.
          # Kept at 8 GB: on this volume every GB of swap is a GB of build space.
          sudo fallocate -l 8G /swap2 || sudo dd if=/dev/zero of=/swap2 bs=1M count=8192
          sudo chmod 600 /swap2
          sudo mkswap /swap2
          sudo swapon /swap2
          free -h
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # Install one by one so a renamed/dropped package name on a newer
          # runner image cannot fail the whole job.
          PKGS="bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev \
            lz4 lzop libsdl1.2-dev libssl-dev libxml2-utils pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            python-is-python3"
          for p in $PKGS; do
            sudo apt-get install -y -qq "$p" >/dev/null 2>&1 || echo "::warning::could not install $p"
          done
          # Java is not needed (AOSP uses its own prebuilt JDK), installed best-effort only.
          sudo apt-get install -y -qq openjdk-21-jdk-headless >/dev/null 2>&1 || true
          printf 'bc: '; command -v bc || echo MISSING
          printf 'zip: '; command -v zip || echo MISSING
          printf 'python3: '; command -v python3 || echo MISSING

      - name: Configure git and repo
        run: |
          git config --global user.name  "XDABuildBot"
          git config --global user.email "buildbot@localhost"
          git config --global color.ui false
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync source + apply device trees
        env:
          JOBS: ${{ inputs.jobs }}
        run: ./scripts/build.sh sync

      - name: Build crDroid
        env:
          JOBS: ${{ inputs.jobs }}
        run: ./scripts/build.sh build

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -v out/target/product/X6739/crDroid*.zip artifacts/ 2>/dev/null || true
          cp -v out/target/product/X6739/boot.img artifacts/ 2>/dev/null || true
          cp -v out/target/product/X6739/vendor_boot.img artifacts/ 2>/dev/null || true
          cp -v out/target/product/X6739/recovery.img artifacts/ 2>/dev/null || true
          cp -v out/target/product/X6739/*.img artifacts/ 2>/dev/null || true
          cp -v build.log artifacts/build.log 2>/dev/null || true
          ls -lh artifacts || true

      - name: Upload ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crDroid16-X6739
          path: artifacts/
          retention-days: 14
          compression-level: 0
